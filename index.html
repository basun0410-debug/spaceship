<script>
"use strict";
/* ========= 공통 ========= */
const $=s=>document.querySelector(s);
const app=$('#app');
const Q=new URLSearchParams(location.search);
const LOCAL=Q.has('local');            // 테스트용: 같은 기기 여러 탭에서 실행
const PREFIX='pyw-spaceship-v2-';
const ST=(()=>{try{const s=(LOCAL||Q.has('tab'))?sessionStorage:localStorage;s.setItem('_t','1');s.removeItem('_t');return s}catch(e){const m={};return{getItem:k=>m[k]??null,setItem:(k,v)=>m[k]=String(v),removeItem:k=>delete m[k]}}})();
const COLORS=['#ef4444','#3b82f6','#22c55e','#eab308','#a855f7','#f97316','#ec4899','#14b8a6','#84cc16','#06b6d4','#f43f5e','#8b5cf6','#10b981','#f59e0b','#6366f1','#d946ef','#0ea5e9','#65a30d','#dc2626','#2563eb','#16a34a','#ca8a04','#9333ea','#ea580c','#db2777','#0d9488','#4d7c0f','#0891b2','#be123c','#7c3aed','#475569','#b45309'];

/* 우주선 지도 (3×3). 옆 칸끼리만 복도로 이어져 있어요 */
const ROOMS={eng:{n:'엔진실',e:'🔧',x:0,y:0},med:{n:'의무실',e:'💊',x:1,y:0},wep:{n:'무기고',e:'🎯',x:2,y:0},
 rea:{n:'원자로',e:'☢️',x:0,y:1},caf:{n:'식당',e:'🍽️',x:1,y:1},nav:{n:'조종실',e:'🧭',x:2,y:1},
 ele:{n:'전기실',e:'⚡',x:0,y:2},sto:{n:'창고',e:'📦',x:1,y:2},com:{n:'통신실',e:'📡',x:2,y:2}};
const RID=Object.keys(ROOMS);
const adj=(a,b)=>{const A=ROOMS[a],B=ROOMS[b];return !!A&&!!B&&Math.abs(A.x-B.x)+Math.abs(A.y-B.y)===1};
const nbrs=r=>RID.filter(x=>adj(r,x));
const VENTS=[['eng','rea','ele'],['wep','nav','com'],['med','sto']];
const ventsFrom=r=>{const g=VENTS.find(v=>v.includes(r));return g?g.filter(x=>x!==r):[]};
const SABS={lights:{n:'전등 고장',e:'💡',room:'ele',how:'전기실에서 스위치를 모두 켜세요'},
 reactor:{n:'원자로 과열',e:'☢️',room:'rea',how:'원자로에서 두 명이 동시에 손을 올려야 해요'},
 comms:{n:'통신 방해',e:'📡',room:'com',how:'통신실에서 주파수를 맞추세요'}};
const rn=r=>ROOMS[r]?ROOMS[r].e+' '+ROOMS[r].n:r;

/* 지금까지 수업한 내용으로 만든 쉬운 퀴즈 (한 줄: [과목] 질문 / 정답 / 오답 / 오답) */
const DEFAULT_QUIZ=`[도덕] 지구가 빠르게 뜨거워지며 생기는 위기는? / 기후 위기 / 지진 / 일식
[도덕] 바다에 버려진 쓰레기 때문에 생기는 문제는? / 해양 쓰레기 / 대기 오염 / 물 부족
[도덕] 공기가 더러워지는 환경 문제는? / 대기 오염 / 해양 쓰레기 / 수질 오염
[도덕] 폭염이나 갑작스러운 폭우는 무엇의 예일까요? / 이상 기후 / 일기 예보 / 계절 변화
[도덕] 환경 위기는 동식물과 우리 삶 모두에 영향을 준다. (O/X) / O / X
[실과] 생활 속 동식물은 무엇에 따라 분류할까요? / 활용 목적 / 생김새 / 색깔
[실과] 털실의 재료가 되는 동물은? / 양 / 고양이 / 앵무새
[실과] 비단실을 얻을 수 있는 동물은? / 누에 / 닭 / 돼지

function beep(f,d,type,t0,vol){if(!AC)return;try{const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.value=f;const t=AC.currentTime+(t0||0);g.gain.setValueAtTime(vol||.2,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.05)}catch(e){}}

 win(){[523,659,784,1046,1318].forEach((f,i)=>beep(f,.4,'triangle',i*.18,.2))},
 lose(){[392,330,262,196].forEach((f,i)=>beep(f,.45,'sawtooth',i*.25,.12))},

function noise(d,vol,freq){if(!AC)return;try{const n=AC.sampleRate*d,b=AC.createBuffer(1,n,AC.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);const s=AC.createBufferSource();s.buffer=b;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=freq||1200;const g=AC.createGain();g.gain.value=vol||.2;s.connect(f);f.connect(g);g.connect(AC.destination);s.start()}catch(e){}}

function hostTransport(code,onMsg,onReady,onErr){
 if(LOCAL){const bc=new BroadcastChannel('ship-'+code);bc.onmessage=e=>{const m=e.data;if(m&&m.to==='host')onMsg(m.from,m.data)};setTimeout(onReady,0);
  return{send(cid,data){bc.postMessage({to:cid,data})},close(){bc.close()}}}
 const peer=new Peer(PREFIX+code);const conns={};
 peer.on('open',onReady);
 peer.on('error',e=>onErr(e));
 peer.on('disconnected',()=>{setTimeout(()=>{try{peer.reconnect()}catch(e){}},1500)});
 setInterval(()=>{if(!peer.destroyed&&peer.disconnected){try{peer.reconnect()}catch(e){}}},5000);
 window.addEventListener('online',()=>{if(!peer.destroyed&&peer.disconnected){try{peer.reconnect()}catch(e){}}});
 peer.on('connection',c=>{c.on('data',d=>{if(d&&d.cid){conns[d.cid]=c;onMsg(d.cid,d)}});c.on('close',()=>{for(const k in conns)if(conns[k]===c){delete conns[k];onMsg(k,{t:'bye'})}})});
 return{send(cid,data){const c=conns[cid];if(c&&c.open){try{c.send(data)}catch(e){}}},close(){peer.destroy()}};
}
function playerTransport(code,cid,onMsg,onOpen,onLost,onErr){
 let out=[],alive=false,lastHeard=0;
 const flush=send=>{const q=out;out=[];q.forEach(send)};
 if(LOCAL){const bc=new BroadcastChannel('ship-'+code);bc.onmessage=e=>{const m=e.data;if(m&&m.to===cid){lastHeard=Date.now();onMsg(m.data)}};
  const raw=d=>{d.cid=cid;bc.postMessage({to:'host',from:cid,data:d})};
  setTimeout(()=>{alive=true;lastHeard=Date.now();onOpen()},50);
  setInterval(()=>raw({t:'ping'}),3000);
  return{send(d){raw(d)},kick(){}}}
 let peer=null,conn=null,timer=null,opened=false,openTimer=null,lostShown=false;
 const raw=d=>{d.cid=cid;try{conn.send(d)}catch(e){out.push(d)}};
 const lost=()=>{alive=false;if(!lostShown){lostShown=true;onLost()}};
 const retry=ms=>{if(timer)return;timer=setTimeout(()=>{timer=null;connect()},ms??(1200+Math.random()*1500))};
 function newPeer(){try{peer&&peer.destroy()}catch(e){}peer=new Peer();
  peer.on('open',()=>connect());
  peer.on('error',e=>{if(e.type==='peer-unavailable'){onErr(opened?'lost':'nohost');lost();retry(2500)}else{onErr(e.type);lost();if(['network','server-error','socket-error','socket-closed'].includes(e.type)){try{peer.destroy()}catch(x){}}retry()}});
  peer.on('disconnected',()=>{try{peer.reconnect()}catch(e){}});
 }
 function connect(){
  if(!peer||peer.destroyed){newPeer();return}
  if(peer.disconnected){try{peer.reconnect()}catch(e){newPeer()}return}
  if(!peer.open)return;
  try{conn&&conn.close()}catch(e){}
  const c=peer.connect(PREFIX+code,{reliable:true});conn=c;
  clearTimeout(openTimer);openTimer=setTimeout(()=>{if(conn===c&&!c.open){lost();retry(500)}},8000);
  c.on('open',()=>{if(conn!==c)return;clearTimeout(openTimer);opened=true;alive=true;lostShown=false;lastHeard=Date.now();onOpen();flush(raw)});
  c.on('data',d=>{if(conn!==c)return;lastHeard=Date.now();if(d&&d.t==='pong')return;onMsg(d)});
  c.on('close',()=>{if(conn!==c)return;lost();retry()});
  c.on('error',()=>{if(conn!==c)return;lost();retry()});
 }
 function kick(){lost();clearTimeout(timer);timer=null;if(!peer||peer.destroyed||peer.disconnected)newPeer();else connect()}
 setInterval(()=>{if(alive&&conn&&conn.open)raw({t:'ping'});if(opened&&Date.now()-lastHeard>10000&&!timer)kick()},3000);
 document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){if(!(conn&&conn.open)||Date.now()-lastHeard>5000)kick();else raw({t:'hello',name:myName})}});
 window.addEventListener('online',()=>kick());
 newPeer();
 return{send(d){if(alive&&conn&&conn.open)raw(d);else if(['task','vote','fix'].includes(d.t)){d.cid=cid;out.push(d)}},kick};
}

function onHostMsg(cid,m){
 if(!m||!S)return;
 if(m.t==='hello'){hello(cid,String(m.name||'').trim().slice(0,8));return}
 const pid=S.cid[cid];const p=pid&&P(pid);
 if(m.t==='bye'){if(p&&S.pc[pid]===cid){p.on=false;renderHost()}return}
 if(m.t==='ping'){if(p&&S.pc[pid]===cid){p.seen=Date.now();if(!p.on){p.on=true;renderHost()}HT.send(cid,{t:'pong'})}return}
 if(!p)return;
 if(S.pc[pid]!==cid)return;
 const play=S.phase==='play',now=Date.now();
 switch(m.t){
 case 'move':
  if(!play||!ROOMS[m.room])return sendTo(pid);
  if(p.alive&&!adj(p.room,m.room))return sendTo(pid);
  moveTo(p,m.room);bcastAll();break;
 case 'vent':
  if(!play||p.role!=='imp'||!p.alive||!ventsFrom(p.room).includes(m.room))return sendTo(pid);
  moveTo(p,m.room);bcastAll();break;
 case 'task':{
  if(!play)return sendTo(pid);
  const k=p.tasks.find(x=>x.id===m.id);if(!k||k.done)return sendTo(pid);
  if(k.room!==p.room&&!m.retry)return sendTo(pid);
  k.done=true;
  if(p.role==='crew'&&checkWin())return;
  bcastAll();renderHost();break}
 case 'kill':{
  const v=P(m.target);
  if(!play||p.role!=='imp'||!p.alive||now<(p.cd||0)||!v||!v.alive||v.role==='imp'||v.room!==p.room)return sendTo(pid);
  doKill(p,v);break}
 case 'report':{
  const b=S.bodies.find(x=>x.room===p.room);
  if(!play||!p.alive||!b)return sendTo(pid);
  callMeeting(p.name,{name:P(b.pid).name,room:p.room});break}
 case 'meet':
  if(play&&p.alive&&p.meet>0&&p.room==='caf'&&!S.sab){p.meet--;callMeeting(p.name)}else sendTo(pid);break;
 case 'sab':
  if(!play||p.role!=='imp'||S.sab||now<(S.sabCd||0)||!SABS[m.type])return sendTo(pid);
  startSab(m.type);break;
 case 'fix':
  if(!play||!p.alive||!S.sab||S.sab.type!==m.type||m.type==='reactor'||p.room!==SABS[m.type].room)return sendTo(pid);
  endSab();break;
 case 'hold':
  if(!play||!S.sab||S.sab.type!=='reactor')return sendTo(pid);
  if(m.on&&(!p.alive||p.room!=='rea'))return sendTo(pid);
  S.sab.holders[pid]=!!m.on;
  if(holdN()>=2){endSab();break}
  bcastAll();renderHost();break;
 case 'vote':
  if(S.phase!=='vote'||!p.alive||p.vote!=null)return sendTo(pid);
  if(m.target!=='skip'){const v=P(m.target);if(!v||!v.alive)return sendTo(pid)}
  p.vote=m.target;
  if(alivePlayers().every(q=>q.vote!=null)){endVote();return}
  bcastAll();renderHost();break;
 }
}

function endVote(){

function stepToward(b,target){
 if(b.room===target)return;
 if(!b.alive){b.room=target;return}
 const T=ROOMS[target];const opts=nbrs(b.room).sort((x,y)=>(Math.abs(ROOMS[x].x-T.x)+Math.abs(ROOMS[x].y-T.y))-(Math.abs(ROOMS[y].x-T.x)+Math.abs(ROOMS[y].y-T.y)));
 moveTo(b,opts[0]);
}
function botTick(){
 if(!S||!['play','vote'].includes(S.phase))return;
 const now=Date.now();
 for(const id of S.order){const b=P(id);if(!b||!b.bot)continue;
  if(!b.next)b.next=now+1500+Math.random()*2500;
  if(now<b.next)continue;
  b.next=now+2000+Math.random()*2500;
  if(S.phase==='vote'){
   if(!b.alive||b.vote!=null)continue;
   const opts=alivePlayers().filter(q=>q.pid!==b.pid&&!(b.role==='imp'&&q.role==='imp'));
   b.vote=Math.random()<.25||!opts.length?'skip':pick(opts).pid;
   if(alivePlayers().every(q=>q.vote!=null)){endVote();return}
   bcastAll();renderHost();continue;
  }
  if(S.sab&&S.sab.type==='reactor'&&b.alive){
   if(b.room==='rea'){S.sab.holders[b.pid]=true;if(holdN()>=2){endSab();return}}else stepToward(b,'rea');
   bcastAll();renderHost();continue;
  }
  if(b.alive&&b.role==='crew'){const body=S.bodies.find(x=>x.room===b.room);if(body&&Math.random()<.6){callMeeting(b.name,{name:P(body.pid).name,room:b.room});return}}
  if(S.sab&&b.alive&&b.role==='crew'&&S.sab.type!=='reactor'&&Math.random()<.35){const fr=SABS[S.sab.type].room;if(b.room===fr){endSab();return}stepToward(b,fr);bcastAll();continue}
  if(b.role==='imp'){
   if(b.alive){const tg=S.order.map(P).filter(q=>q.alive&&q.role!=='imp'&&q.room===b.room);if(tg.length&&now>=(b.cd||0)&&Math.random()<.45){doKill(b,pick(tg));return}}
   if(!S.sab&&now>=(S.sabCd||0)&&Math.random()<.06){startSab(pick(Object.keys(SABS)));return}
   if(b.alive)moveTo(b,pick(nbrs(b.room)));
   bcastAll();continue;
  }
  const t=b.tasks.find(x=>!x.done&&x.room===b.room);
  if(t){t.done=true;if(checkWin())return;bcastAll();renderHost();continue}
  const nt=b.tasks.find(x=>!x.done);
  if(nt)stepToward(b,nt.room);else if(b.alive)moveTo(b,pick(nbrs(b.room)));
  bcastAll();
 }
}

  <div style="font-size:21px;font-weight:800">${sb?'🚨 긴급 회의는 위급 상황에는 열 수 없어요!<br>먼저 고장을 고쳐 주세요.':n<=0?'비상 버튼을 이미 다 썼어요.':`남은 횟수: ${n}회`}</div>
  <p></p><button class="btn gray" onclick="closeOv()">닫기</button></div>`,'meet');
 const b=$('#ebgo');if(b)b.onclick=()=>{PT.send({t:'meet'});closeOv()};
}
function useList(){
 const me=V.me,sb=V.sab,out=[];if(V.phase!=='play')return out;
 if(sb&&me.alive&&SABS[sb.type].room===me.room)out.push({l:`🛠️ ${SABS[sb.type].n} 고치기`,f:()=>openFix(sb.type)});
 if(!commsOut())me.tasks.filter(t=>t.room===me.room&&!t.done).forEach(t=>out.push({l:`📚 ${me.role==='imp'?'(가짜) ':''}퀴즈 임무${t.q&&t.q.s?' · '+t.q.s:''}`,f:()=>openTask(t.id)}));
 if(me.room==='caf'&&me.alive)out.push({l:'🔴 비상 버튼',f:askMeeting});
 return out;
}
let pickFns=[];
function chooser(title,items,kind){pickFns=items.map(i=>i.f);openOv(`<div style="padding-top:30px"><h2 class="center">${title}</h2>${items.map((i,k)=>`<button class="vbtn" onclick="const f=pickFns[${k}];closeOv();f()">${i.h||esc(i.l)}</button>`).join('')}<p></p><button class="btn gray big" onclick="closeOv()">닫기</button></div>`,kind||'pick')}
function doUse(){const u=useList();if(!u.length)return;if(u.length===1)return u[0].f();chooser('무엇을 할까요?',u)}
function doKillBtn(){if(V.cdEnd>Date.now())return;const tg=(V.here||[]).filter(q=>q.alive&&!q.imp);if(!tg.length)return toast('이 방에는 제거할 크루원이 없어요','#475569');if(tg.length===1)return confirmKill(tg[0].pid);chooser('🔪 누구를 제거할까요?',tg.map(q=>({h:`${av(q,34)} ${esc(q.name)}`,f:()=>confirmKill(q.pid)})))}
function openVent(){const vs=ventsFrom(V.me.room);if(!vs.length)return;chooser('🕳️ 환풍구로 어디로 갈까요?',vs.map(r=>({l:rn(r),f:()=>vent(r)})))}
function openSabMap(){
 const rooms=RID.map(r=>{const T=ROOMS[r];const k=Object.keys(SABS).find(x=>SABS[x].room===r);
  return `<div class="room" style="grid-column:${T.x+1};grid-row:${T.y+1}"><div>${T.n}</div>${k?`<button class="sbtn" onclick="doSab('${k}');closeOv()">${SABS[k].e}</button><div style="font-size:13px">${SABS[k].n}</div>`:''}</div>`}).join('');
 openOv(`<div style="padding-top:30px"><h2 class="center">💥 방해 공작 지도</h2><div class="center small" id="sabcd"></div><div class="map sabmap" style="margin-top:10px">${rooms}</div>
  <div class="small" style="margin-top:10px;line-height:1.6">💡 전등: 크루원 시야 차단 · 📡 통신: 임무 목록 숨김 · ☢️ 원자로: ${'제한 시간 안에 못 고치면 임포스터 승리!'}</div><p></p><button class="btn gray big" onclick="closeOv()">닫기</button></div>`,'sabmap');pTick();
}
function memoCard(){const others=V.players.filter(p=>p.pid!==V.me.pid);return`<div class="card"><b>🤔 수상한 사람 메모</b> <span class="small">(나만 보여요. 눌러서 표시)</span><div class="plist" style="margin-top:8px">${others.map(p=>`<div class="pl ${p.alive?'':'dead'}" onclick="toggleNote('${p.pid}')">${av(p)}<span>${esc(p.name)}</span><span class="mark">${notes[p.pid]?'🤔':''}</span></div>`).join('')}</div></div>`}
function toggleNote(pid){notes[pid]=!notes[pid];lastSig='';renderPlayer()}
function confirmKill(pid){const p=(V.here||[]).find(x=>x.pid===pid);if(!p)return;if(V.cdEnd>Date.now())return toast('아직 기다려야 해요','#dc2626');
 openOv(`<div class="center" style="padding-top:40px">${av(p,90)}<h2>${esc(p.name)} 님을 제거할까요?</h2><div class="row"><button class="btn big gray" onclick="closeOv()">취소</button><button class="btn big red" onclick="PT.send({t:'kill',target:'${pid}'});closeOv();toast('🔪 제거 완료… 들키지 마세요!','#7f1d1d')">제거</button></div></div>`,'kill')}
let voteSel=null;
function pickVote(pid,el){voteSel=pid;document.querySelectorAll('.vbtn').forEach(b=>b.classList.remove('sel'));el.classList.add('sel');$('#voteGo').disabled=false;$('#voteGo').textContent=pid==='skip'?'⏭ 건너뛰기로 투표하기':'✅ 이 사람에게 투표하기'}
function sendVote(){if(!voteSel)return;myVote=voteSel;PT.send({t:'vote',target:voteSel});voteSel=null;$('#voteGo').disabled=true;$('#voteGo').textContent='보내는 중…'}

/* 오버레이 */
function openOv(h,kind){ovKind=kind||'';$('#ovin').innerHTML=h;$('#ov').classList.add('show')}
function closeOv(){if(ovKind==='fixreactor'&&holding){holding=false;PT&&PT.send({t:'hold',on:false})}ovKind='';$('#ov').classList.remove('show');$('#ovin').innerHTML=''}
function liveOv(){ // 열려 있는 고치기 화면을 최신 상태로
 if(ovKind==='fixreactor'){const n=$('#holdn');if(n&&V.sab)n.textContent=V.sab.holders;if(!V.sab||V.me.room!=='rea')closeOv()}
 if(ovKind.startsWith('task')&&V.phase==='play'){const id=ovKind.slice(4);const t=V.me.tasks.find(x=>x.id===id);if(!t||t.room!==V.me.room)closeOv()}
 if(ovKind==='kill'&&V.cdEnd>Date.now())closeOv();
}

/* ========= 임무: 수업 퀴즈 ========= */
function openTask(id){
 const t=V.me.tasks.find(x=>x.id===id);if(!t||t.done||V.phase!=='play')return;
 openOv(`<div id="mg"></div>`,'task'+id);
 const box=$('#mg');
 const q=t.q||{q:'1+1은?',a:'2',w:['3','11']};
 const opts=shuffle([q.a,...q.w]);
 box.innerHTML=`<div class="center" style="padding-top:20px">${q.s?`<span class="subj">${esc(q.s)}</span>`:''}<p class="mgt">${esc(q.q)}</p></div>${opts.map(o=>`<button class="opt">${esc(o)}</button>`).join('')}`;
 box.querySelectorAll('.opt').forEach((b,k)=>b.onclick=()=>{
  if(opts[k]===q.a){b.style.background='#16a34a';setTimeout(()=>{if(!box.isConnected)return;closeOv();doneLocal.add(id);PT.send({t:'task',id});t.done=true;lastSig='';renderPlayer();toast('✅ 정답! 임무 완료!');initAudio();beep(1046,.15,'sine',0,.15)},400)}
  else{b.classList.add('bad');b.disabled=true;shake(b);toast('다시 생각해 봐요!','#dc2626')}
 });
}
function shake(el){el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake')}

/* ========= 방해 공작 고치기 ========= */
let holding=false;
function openFix(type){
 if(type==='lights'){
  let st=Array.from({length:5},()=>Math.random()<.5);if(st.every(x=>x))st[0]=false;
  openOv(`<div class="center" style="padding-top:30px"><h2>💡 전등 스위치를 모두 켜세요</h2><div class="row" id="sws" style="justify-content:center;flex-wrap:nowrap;margin-top:20px"></div></div>`,'fixlights');
  const draw=()=>{$('#sws').innerHTML=st.map((on,i)=>`<button class="sw ${on?'on':'off'}" style="flex:0 0 auto" data-i="${i}">${on?'ON':'OFF'}</button>`).join('');
   document.querySelectorAll('.sw').forEach(b=>b.onclick=()=>{st[+b.dataset.i]=!st[+b.dataset.i];draw();if(st.every(x=>x)){PT.send({t:'fix',type:'lights'});toast('💡 전등을 고쳤어요!');setTimeout(closeOv,300)}})};
  draw();
 }else if(type==='comms'){
  const target=10+Math.random()*80|0;
  openOv(`<div class="center" style="padding-top:30px"><h2>📡 주파수를 <span style="color:#fde047">${target}</span>에 맞추세요</h2><div style="font-size:60px;font-weight:900" id="fq">0</div><input type="range" id="rg" min="0" max="100" value="${target>50?5:95}" style="height:60px"></div>`,'fixcomms');
  const rg=$('#rg');const chk=()=>{$('#fq').textContent=rg.value;if(Math.abs(+rg.value-target)<=1){rg.disabled=true;PT.send({t:'fix',type:'comms'});toast('📡 통신을 고쳤어요!');setTimeout(closeOv,400)}};
  rg.oninput=chk;$('#fq').textContent=rg.value;
 }else if(type==='reactor'){
  openOv(`<div class="center" style="padding-top:20px"><h2>☢️ 원자로를 식혀요!</h2><p style="font-size:19px">손바닥 버튼을 <b>꾹 누르고 있으세요</b>.<br>다른 친구 한 명도 동시에 눌러야 해요.</p><button class="hand" id="hand">✋</button><h2>지금 <span id="holdn">${V.sab?V.sab.holders:0}</span> / 2명</h2></div>`,'fixreactor');
  const hb=$('#hand');
  const on=e=>{e.preventDefault();if(holding)return;holding=true;hb.classList.add('on');PT.send({t:'hold',on:true})};
  const off=()=>{if(!holding)return;holding=false;hb.classList.remove('on');PT.send({t:'hold',on:false})};
  hb.addEventListener('pointerdown',on);hb.addEventListener('pointerup',off);hb.addEventListener('pointerleave',off);hb.addEventListener('pointercancel',off);hb.addEventListener('contextmenu',e=>e.preventDefault());
 }
}

/* ========= 시작 ========= */
(function boot(){
 if(Q.get('join')){const c=ST.getItem('ship-code'),n=ST.getItem('ship-name');if(c===Q.get('join')&&n)startPlayer(c,n);else joinForm('');return}
 const c=ST.getItem('ship-code'),n=ST.getItem('ship-name');
 if(c&&n&&!Q.has('host')){startPlayer(c,n);return}
 home();
})();
</script>
</body>
</html>
