<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>우리 반 우주선 – 임포스터를 찾아라!</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;color:#eef2ff;
 background-color:#0b1026;background-image:radial-gradient(ellipse at 20% 10%,#1e2a6b 0,transparent 50%),radial-gradient(ellipse at 80% 90%,#3b1a5c 0,transparent 50%);
 background-attachment:fixed;user-select:none;-webkit-user-select:none;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.6;
 background-image:radial-gradient(1px 1px at 10% 20%,#fff,transparent),radial-gradient(1px 1px at 30% 70%,#fff,transparent),radial-gradient(2px 2px at 55% 30%,#fff,transparent),radial-gradient(1px 1px at 75% 55%,#fff,transparent),radial-gradient(1px 1px at 90% 15%,#fff,transparent),radial-gradient(2px 2px at 15% 85%,#fff,transparent),radial-gradient(1px 1px at 65% 90%,#fff,transparent),radial-gradient(1px 1px at 45% 50%,#fff,transparent);background-size:400px 400px}
#app{position:relative;max-width:1400px;margin:0 auto;padding:18px}
h1{margin:.2em 0 .4em;font-size:clamp(26px,4vw,48px);text-align:center}
h2{margin:.3em 0;font-size:clamp(20px,2.6vw,34px)}
.sub{opacity:.75;text-align:center}
.card{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:20px;padding:18px;margin:12px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:16px;padding:14px 22px;font:inherit;font-weight:800;font-size:20px;color:#fff;background:#4f46e5;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.35)}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.35)}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn.red{background:#dc2626}.btn.green{background:#16a34a}.btn.gray{background:#475569}.btn.amber{background:#d97706}.btn.purple{background:#7c3aed}
.btn.big{font-size:26px;padding:20px 28px;width:100%}
.row{display:flex;gap:12px;flex-wrap:wrap}.row>*{flex:1}
.center{text-align:center}
input,textarea,select{font:inherit;font-size:20px;padding:12px 14px;border-radius:12px;border:2px solid #6366f1;background:#0f172a;color:#fff;width:100%;user-select:text;-webkit-user-select:text}
textarea{font-size:15px;min-height:130px}
label{display:block;margin:8px 0 4px;font-weight:700}
.av{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;font-weight:900;font-size:20px;color:#fff;border:3px solid rgba(255,255,255,.8);flex:none;text-shadow:0 1px 2px #0008}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pl{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.08);border-radius:14px;padding:8px 10px;font-weight:800;font-size:19px;position:relative}
.pl.dead{opacity:.35;text-decoration:line-through}
.pl .mark{margin-left:auto;font-size:22px}
.pl.off:after{content:"연결 끊김";position:absolute;right:6px;bottom:2px;font-size:11px;color:#fca5a5}
.code{font-size:clamp(60px,10vw,130px);font-weight:900;letter-spacing:.12em;text-align:center;color:#fde047;line-height:1}
.qr{background:#fff;border-radius:14px;padding:8px;display:inline-block}.qr svg{display:block;width:200px;height:200px}
.bar{height:34px;background:rgba(255,255,255,.12);border-radius:999px;overflow:hidden;border:2px solid rgba(255,255,255,.25)}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#22c55e,#84cc16);transition:width .5s}
.huge{font-size:clamp(40px,7vw,96px);font-weight:900;text-align:center;line-height:1.15;margin:.2em 0}
.timer{font-size:clamp(50px,9vw,120px);font-weight:900;text-align:center;font-variant-numeric:tabular-nums}
.alarm{animation:flash 1s infinite}
@keyframes flash{0%,100%{background:rgba(220,38,38,.25)}50%{background:rgba(220,38,38,.6)}}
.tasks{display:grid;gap:10px}
.task{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:21px;font-weight:800;padding:16px;border-radius:16px;background:#1e293b;border:2px solid #334155;color:#fff;cursor:pointer}
.task.done{background:#14532d;border-color:#22c55e;opacity:.8;pointer-events:none}
.rolebtn{width:100%;padding:16px;border-radius:16px;border:2px dashed #94a3b8;background:transparent;color:#cbd5e1;font:inherit;font-size:19px;font-weight:800}
.rolebox{display:none;margin-top:8px;padding:16px;border-radius:16px;font-size:24px;font-weight:900;text-align:center}
.rolebox.show{display:block}.rolebox.crew{background:#1d4ed8}.rolebox.imp{background:#b91c1c}
#ov{position:fixed;inset:0;background:rgba(3,6,20,.92);display:none;z-index:50;overflow:auto}
#ov.show{display:block}
#ovin{max-width:640px;margin:0 auto;padding:20px}
.x{position:absolute;right:14px;top:10px;font-size:34px;background:none;border:0;color:#fff;cursor:pointer}
.mgt{font-size:22px;font-weight:800;text-align:center}
.wires{position:relative;display:flex;justify-content:space-between;padding:10px 20px;height:360px}
.wires svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.wcol{display:flex;flex-direction:column;justify-content:space-around;z-index:1}
.wire{width:80px;height:52px;border-radius:12px;border:4px solid #fff3;cursor:pointer}
.wire.sel{border-color:#fff;transform:scale(1.12)}.wire.ok{border-color:#22c55e}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:380px;margin:16px auto}
.num{aspect-ratio:1;font-size:40px;font-weight:900;border-radius:16px;border:0;background:#334155;color:#fff}
.num.ok{background:#16a34a}
.simon{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:340px;margin:16px auto}
.sp{aspect-ratio:1;border-radius:22px;border:0;opacity:.45;transition:opacity .1s}
.sp.lit{opacity:1;box-shadow:0 0 30px currentColor}
.opt{display:block;width:100%;margin:10px 0;padding:18px;font:inherit;font-size:22px;font-weight:800;border-radius:16px;border:0;background:#334155;color:#fff}
.opt.bad{background:#7f1d1d;opacity:.6}
.holdbtn{width:220px;height:220px;border-radius:50%;border:0;font:inherit;font-size:26px;font-weight:900;color:#fff;background:#d97706;display:block;margin:20px auto;touch-action:none}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#16a34a;color:#fff;padding:14px 24px;border-radius:999px;font-weight:900;font-size:20px;z-index:99;box-shadow:0 6px 20px #0008}
.status{position:fixed;top:0;left:0;right:0;background:#b45309;color:#fff;text-align:center;padding:6px;font-weight:800;z-index:98}
.pend{position:fixed;right:14px;bottom:14px;z-index:60;background:#1e293b;border:2px solid #f59e0b;border-radius:16px;padding:12px;max-width:340px}
.vbtn{display:flex;align-items:center;gap:12px;width:100%;margin:8px 0;padding:12px;font:inherit;font-size:21px;font-weight:800;border-radius:14px;border:2px solid #475569;background:#1e293b;color:#fff;text-align:left}
.vbtn.sel{border-color:#fde047;background:#3f3a10}
.memo{font-size:22px}
.ghost{filter:grayscale(.6)}
.small{font-size:14px;opacity:.7}
details summary{cursor:pointer;font-weight:800;font-size:20px}
.setgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.eject{animation:fly 3s ease-in forwards;display:inline-block}
@keyframes fly{0%{transform:translateX(-40vw) rotate(0)}100%{transform:translateX(40vw) rotate(720deg)}}
</style>

<script>
"use strict";
/* ========= 공통 ========= */
const $=s=>document.querySelector(s);
const app=$('#app');
const Q=new URLSearchParams(location.search);
const LOCAL=Q.has('local');            // 테스트용: 같은 기기 여러 탭에서 실행
const PREFIX='pyw-spaceship-v1-';
// 패드 브라우저가 꺼졌다 켜져도 같은 사람으로 다시 들어가도록 localStorage 사용 (테스트 모드만 탭별 저장)
const ST=(()=>{try{const s=(LOCAL||Q.has('tab'))?sessionStorage:localStorage;s.setItem('_t','1');s.removeItem('_t');return s}catch(e){const m={};return{getItem:k=>m[k]??null,setItem:(k,v)=>m[k]=String(v),removeItem:k=>delete m[k]}}})();
const COLORS=['#ef4444','#3b82f6','#22c55e','#eab308','#a855f7','#f97316','#ec4899','#14b8a6','#84cc16','#06b6d4','#f43f5e','#8b5cf6','#10b981','#f59e0b','#6366f1','#d946ef','#0ea5e9','#65a30d','#dc2626','#2563eb','#16a34a','#ca8a04','#9333ea','#ea580c','#db2777','#0d9488','#4d7c0f','#0891b2','#be123c','#7c3aed','#475569','#b45309'];
const TASKNAME={wires:'🔌 전선 연결하기',order:'🔢 숫자 순서 맞추기',hold:'⛽ 연료 채우기',simon:'🎵 신호 기억하기',quiz:'📚 우리 반 퀴즈'};
const DEFAULT_QUIZ=`우리 학교 이름은? / 평원초등학교 / 평화초등학교 / 평원중학교
1년은 몇 개월일까요? / 12개월 / 10개월 / 13개월
태양계에서 가장 큰 행성은? / 목성 / 토성 / 지구
물이 어는 온도는? / 0도 / 10도 / 100도
우리나라의 수도는? / 서울 / 부산 / 대전
무지개는 몇 가지 색? / 7가지 / 5가지 / 9가지`;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const rid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const av=(p,size)=>`<span class="av" style="background:${p.color}${size?`;width:${size}px;height:${size}px;font-size:${size*.45}px`:''}">${esc([...p.name][0]||'?')}</span>`;
function toast(t,color){const d=document.createElement('div');d.className='toast';d.textContent=t;if(color)d.style.background=color;document.body.appendChild(d);setTimeout(()=>d.remove(),1800)}
function setStatus(t){let s=$('#status');if(!t){s&&s.remove();return}if(!s){s=document.createElement('div');s.id='status';s.className='status';document.body.appendChild(s)}s.innerHTML=esc(t)+(typeof PT!=='undefined'&&PT&&PT.kick?' <button class="btn" style="padding:4px 12px;font-size:15px;margin-left:8px" onclick="PT.kick()">지금 다시 연결</button>':'')}
function loadScript(src){return new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s)})}
let peerLib=null;
function needPeer(){ if(LOCAL) return Promise.resolve(); if(!peerLib) peerLib=loadScript('https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js').catch(()=>loadScript('https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js')); return peerLib }
function parseQuiz(txt){return String(txt||'').split('\n').map(l=>l.split('/').map(s=>s.trim()).filter(Boolean)).filter(a=>a.length>=2).map(a=>({q:a[0],a:a[1],w:a.slice(2)}))}

/* 소리 */
let AC=null;
function initAudio(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();AC.resume&&AC.resume()}catch(e){}}
function beep(f,d,type,t0,vol){if(!AC)return;try{const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.value=f;const t=AC.currentTime+(t0||0);g.gain.setValueAtTime(vol||.2,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.05)}catch(e){}}
const SND={alarm(){for(let i=0;i<8;i++)beep(i%2?620:880,.26,'square',i*.3,.12)},
 start(){[523,659,784,1046].forEach((f,i)=>beep(f,.3,'triangle',i*.15,.2))},
 win(){[523,659,784,1046,1318].forEach((f,i)=>beep(f,.4,'triangle',i*.18,.2))},
 lose(){[392,330,262,196].forEach((f,i)=>beep(f,.45,'sawtooth',i*.25,.12))},
 ding(){beep(988,.25,'sine',0,.2);beep(1318,.4,'sine',.12,.2)},
 drum(){for(let i=0;i<10;i++)beep(110,.1,'square',i*.12,.15)}};

/* ========= 통신 ========= */
function hostTransport(code,onMsg,onReady,onErr){
 if(LOCAL){const bc=new BroadcastChannel('ship-'+code);bc.onmessage=e=>{const m=e.data;if(m&&m.to==='host')onMsg(m.from,m.data)};setTimeout(onReady,0);
  return{send(cid,data){bc.postMessage({to:cid,data})},close(){bc.close()}}}
 const peer=new Peer(PREFIX+code);const conns={};
 peer.on('open',onReady);
 peer.on('error',e=>onErr(e));
 peer.on('disconnected',()=>{setTimeout(()=>{try{peer.reconnect()}catch(e){}},1500)});
 setInterval(()=>{if(!peer.destroyed&&peer.disconnected){try{peer.reconnect()}catch(e){}}},5000); // 신호 서버와 끊기면 계속 재시도
 window.addEventListener('online',()=>{if(!peer.destroyed&&peer.disconnected){try{peer.reconnect()}catch(e){}}});
 peer.on('connection',c=>{c.on('data',d=>{if(d&&d.cid){conns[d.cid]=c;onMsg(d.cid,d)}});c.on('close',()=>{for(const k in conns)if(conns[k]===c){delete conns[k];onMsg(k,{t:'bye'})}})});
 return{send(cid,data){const c=conns[cid];if(c&&c.open){try{c.send(data)}catch(e){}}},close(){peer.destroy()}};
}
function playerTransport(code,cid,onMsg,onOpen,onLost,onErr){
 // 보낼 메시지는 연결이 끊긴 동안 모아뒀다가 다시 연결되면 보냄
 let out=[],alive=false,lastHeard=0;
 const flush=send=>{const q=out;out=[];q.forEach(send)};
 if(LOCAL){const bc=new BroadcastChannel('ship-'+code);bc.onmessage=e=>{const m=e.data;if(m&&m.to===cid){lastHeard=Date.now();onMsg(m.data)}};
  const raw=d=>{d.cid=cid;bc.postMessage({to:'host',from:cid,data:d})};
  setTimeout(()=>{alive=true;lastHeard=Date.now();onOpen()},50);
  setInterval(()=>raw({t:'ping'}),3000);
  return{send(d){raw(d)},kick(){}}}
 let peer=null,conn=null,timer=null,opened=false,openTimer=null,lostShown=false;
 const raw=d=>{d.cid=cid;try{conn.send(d)}catch(e){out.push(d)}};
 const lost=()=>{alive=false;if(!lostShown){lostShown=true;onLost()}};
 const retry=ms=>{if(timer)return;timer=setTimeout(()=>{timer=null;connect()},ms??(1200+Math.random()*1500))};
 function newPeer(){try{peer&&peer.destroy()}catch(e){}peer=new Peer();
  peer.on('open',()=>connect());
  peer.on('error',e=>{if(e.type==='peer-unavailable'){onErr(opened?'lost':'nohost');lost();retry(2500)}else{onErr(e.type);lost();if(['network','server-error','socket-error','socket-closed'].includes(e.type)){try{peer.destroy()}catch(x){}}retry()}});
  peer.on('disconnected',()=>{try{peer.reconnect()}catch(e){}});
 }
 function connect(){
  if(!peer||peer.destroyed){newPeer();return}
  if(peer.disconnected){try{peer.reconnect()}catch(e){newPeer()}return}
  if(!peer.open)return;
  try{conn&&conn.close()}catch(e){}
  const c=peer.connect(PREFIX+code,{reliable:true});conn=c;
  clearTimeout(openTimer);openTimer=setTimeout(()=>{if(conn===c&&!c.open){lost();retry(500)}},8000); // 8초 안에 안 열리면 다시
  c.on('open',()=>{if(conn!==c)return;clearTimeout(openTimer);opened=true;alive=true;lostShown=false;lastHeard=Date.now();onOpen();flush(raw)});
  c.on('data',d=>{if(conn!==c)return;lastHeard=Date.now();if(d&&d.t==='pong')return;onMsg(d)});
  c.on('close',()=>{if(conn!==c)return;lost();retry()});
  c.on('error',()=>{if(conn!==c)return;lost();retry()});
 }
 function kick(){ // 강제로 다시 연결
  lost();clearTimeout(timer);timer=null;
  if(!peer||peer.destroyed||peer.disconnected)newPeer();else connect();
 }
 // 하트비트: 3초마다 신호, 10초 동안 선생님 화면에서 아무 소식이 없으면 다시 연결
 setInterval(()=>{if(alive&&conn&&conn.open)raw({t:'ping'});if(opened&&Date.now()-lastHeard>10000&&!timer)kick()},3000);
 // 패드가 잠들었다 깨거나 다른 앱에 갔다 돌아오면 바로 다시 연결
 document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){if(!(conn&&conn.open)||Date.now()-lastHeard>5000)kick();else raw({t:'hello',name:myName})}});
 window.addEventListener('online',()=>kick());
 newPeer();
 return{send(d){if(alive&&conn&&conn.open)raw(d);else{d.cid=cid;out.push(d)}},kick};
}
/* 화면 꺼짐 방지 */
let wakeLock=null;
async function keepAwake(){try{if('wakeLock' in navigator&&document.visibilityState==='visible'&&!wakeLock){wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener('release',()=>{wakeLock=null})}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')keepAwake()});
document.addEventListener('pointerdown',keepAwake,{passive:true});

/* ========= 첫 화면 ========= */
function home(){
 const saved=hostSaved();
 app.innerHTML=`<h1>🚀 우리 반 우주선</h1><p class="sub" style="font-size:22px">우주선 안에 숨어 있는 <b style="color:#f87171">임포스터</b>를 찾아라!</p>
 <div class="card" style="max-width:560px;margin:24px auto">
  <button class="btn big purple" id="bHost">🖥️ 선생님 화면으로 시작 (전자칠판)</button>
  ${saved?`<p></p><button class="btn big amber" id="bResume">↩️ 진행 중이던 게임 이어하기 (방 코드 ${esc(saved.code)})</button>`:''}
  <p></p><button class="btn big green" id="bJoin">📱 학생으로 참가하기 (패드)</button>
 </div>`;
 $('#bHost').onclick=()=>{initAudio();startHost(null)};
 if(saved)$('#bResume').onclick=()=>{initAudio();startHost(saved)};
 $('#bJoin').onclick=()=>joinForm('');
}

/* =====================================================
   선생님(호스트)
   ===================================================== */
let S=null,HT=null,hostReady=false;
const DEF={imp:2,disc:60,vote:30,cd:30,tasks:4,meet:1,reveal:true,quiz:DEFAULT_QUIZ};
function loadSet(){try{return Object.assign({},DEF,JSON.parse(localStorage.getItem('ship-set')||'{}'))}catch(e){return{...DEF}}}
function saveSet(){try{localStorage.setItem('ship-set',JSON.stringify(S.set))}catch(e){}}
function hostSaved(){try{const s=JSON.parse(localStorage.getItem('ship-host')||'null');return s&&s.order&&s.order.length?s:null}catch(e){return null}}
function saveHost(){try{localStorage.setItem('ship-host',JSON.stringify(S))}catch(e){}}
const rand4=()=>String(1000+Math.random()*9000|0);

async function startHost(resume){
 S=resume||{code:rand4(),phase:'lobby',set:loadSet(),P:{},order:[],cid:{},pc:{},seq:0,pending:[],deaths:[],meeting:null,timerEnd:0,result:null,winner:null,reason:''};
 S.pending=[];keepAwake();
 Object.values(S.P).forEach(p=>p.on=!!p.bot);
 if(resume&&S.timerEnd){S.timerEnd=Date.now()+15000} // 재시작 시 여유 시간
 app.innerHTML=`<h1>🚀 우리 반 우주선</h1><p class="sub">연결 준비 중…</p>`;
 try{await needPeer()}catch(e){app.innerHTML=`<div class="card center"><h2>⚠️ 인터넷 연결을 확인해주세요</h2><p>게임 연결 모듈을 불러오지 못했어요.</p></div>`;return}
 let tries=0;
 const open=()=>{
  HT=hostTransport(S.code,onHostMsg,()=>{hostReady=true;renderHost();bcastAll()},e=>{
   if(e&&e.type==='unavailable-id'){
    try{HT.close()}catch(x){}
    if(!resume&&S.phase==='lobby'&&!S.order.length){S.code=rand4();open()}
    else if(++tries<20){setStatus('이전 연결 정리 중… 잠시만요 ('+tries+')');setTimeout(open,3000)}

function botTick(){

 for(const id of S.order){const b=P(id);if(!b||!b.bot)continue;
  if(!b.next)b.next=now+4000+Math.random()*8000;

   b.next=now+8000+Math.random()*12000;

  }
 }

}
function confirmKill(pid){const p=V.players.find(x=>x.pid===pid);if(V.cdEnd>Date.now())return toast('아직 기다려야 해요','#dc2626');
 openOv(`<div class="center" style="padding-top:40px">${av(p,90)}<h2>${esc(p.name)} 님을 제거할까요?</h2><div class="row"><button class="btn big gray" onclick="openSpecial()">취소</button><button class="btn big red" onclick="PT.send({t:'kill',target:'${pid}'});closeOv();toast('🔪 제거 완료… 들키지 마세요!','#7f1d1d')">제거</button></div></div>`)}
let voteSel=null;
function pickVote(pid,el){voteSel=pid;document.querySelectorAll('.vbtn').forEach(b=>b.classList.remove('sel'));el.classList.add('sel');$('#voteGo').disabled=false;$('#voteGo').textContent=pid==='skip'?'⏭ 건너뛰기로 투표하기':'✅ 이 사람에게 투표하기'}
function sendVote(){if(!voteSel)return;myVote=voteSel;PT.send({t:'vote',target:voteSel});voteSel=null;$('#voteGo').disabled=true;$('#voteGo').textContent='보내는 중…'}

/* 오버레이 */
function openOv(h){$('#ovin').innerHTML=h;$('#ov').classList.add('show')}
function closeOv(){$('#ov').classList.remove('show');$('#ovin').innerHTML=''}

/* ========= 미니게임(임무) ========= */
function openTask(id){
 const t=V.me.tasks.find(x=>x.id===id);if(!t||t.done||V.phase!=='play')return;
 openOv(`<div id="mg"></div>`);
 const box=$('#mg');
 const done=()=>{if(!box.isConnected)return;closeOv();doneLocal.add(id);PT.send({t:'task',id});t.done=true;lastSig='';renderPlayer();toast('✅ 임무 완료!');beep(1046,.15,'sine',0,.15)};
 ({wires:mgWires,order:mgOrder,hold:mgHold,simon:mgSimon,quiz:mgQuiz})[t.type](box,done,t);
}
function shake(el){el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake')}
function mgWires(box,done){
 const cols=['#ef4444','#3b82f6','#eab308','#ec4899'];const L=shuffle(cols),R=shuffle(cols);
 box.innerHTML=`<p class="mgt">🔌 같은 색 전선을 연결하세요<br><span class="small">왼쪽 → 오른쪽 순서로 누르기</span></p><div class="wires" id="wb"><svg id="ws"></svg><div class="wcol">${L.map(c=>`<button class="wire" data-s="L" data-c="${c}" style="background:${c}"></button>`).join('')}</div><div class="wcol">${R.map(c=>`<button class="wire" data-s="R" data-c="${c}" style="background:${c}"></button>`).join('')}</div></div>`;
 let sel=null,n=0;const wb=box.querySelector('#wb'),svg=box.querySelector('#ws');
 box.querySelectorAll('.wire').forEach(b=>b.onclick=()=>{
  if(b.classList.contains('ok'))return;
  if(b.dataset.s==='L'){box.querySelectorAll('.wire.sel').forEach(x=>x.classList.remove('sel'));sel=b;b.classList.add('sel');return}
  if(!sel){shake(b);return}
  if(sel.dataset.c===b.dataset.c){
   const r0=wb.getBoundingClientRect(),a=sel.getBoundingClientRect(),z=b.getBoundingClientRect();
   svg.insertAdjacentHTML('beforeend',`<line x1="${a.right-r0.left}" y1="${a.top+a.height/2-r0.top}" x2="${z.left-r0.left}" y2="${z.top+z.height/2-r0.top}" stroke="${b.dataset.c}" stroke-width="10" stroke-linecap="round"/>`);
   sel.classList.add('ok');b.classList.add('ok');sel.classList.remove('sel');sel=null;if(++n===4)setTimeout(done,500);
  }else{shake(b);sel.classList.remove('sel');sel=null}
 });
}
function mgOrder(box,done){
 const nums=shuffle([1,2,3,4,5,6,7,8,9]);let next=1;
 box.innerHTML=`<p class="mgt">🔢 1부터 9까지 순서대로 누르세요</p><div class="grid3">${nums.map(n=>`<button class="num" data-n="${n}">${n}</button>`).join('')}</div>`;
 box.querySelectorAll('.num').forEach(b=>b.onclick=()=>{
  if(b.classList.contains('ok'))return;
  if(+b.dataset.n===next){b.classList.add('ok');if(++next>9)setTimeout(done,300)}
  else{shake(box.querySelector('.grid3'));next=1;box.querySelectorAll('.num').forEach(x=>x.classList.remove('ok'))}
 });
}
function mgHold(box,done){
 box.innerHTML=`<p class="mgt">⛽ 버튼을 꾹 누르고 있으면 연료가 채워져요</p><div class="bar"><i id="hb" style="width:0;transition:none;background:linear-gradient(90deg,#f59e0b,#fde047)"></i></div><button class="holdbtn" id="hbtn">꾹!</button>`;
 let p=0,hold=false,last=performance.now();const btn=box.querySelector('#hbtn'),bar=box.querySelector('#hb');
 const on=e=>{e.preventDefault();hold=true},off=()=>hold=false;
 btn.addEventListener('pointerdown',on);btn.addEventListener('pointerup',off);btn.addEventListener('pointerleave',off);btn.addEventListener('pointercancel',off);btn.addEventListener('contextmenu',e=>e.preventDefault());
 const loop=now=>{if(!box.isConnected)return;const dt=now-last;last=now;p=Math.max(0,Math.min(1,p+(hold?dt/3000:-dt/1500)));bar.style.width=(p*100)+'%';btn.textContent=hold?Math.round(p*100)+'%':'꾹!';if(p>=1){done();return}requestAnimationFrame(loop)};
 requestAnimationFrame(loop);
}
function mgSimon(box,done){
 const cols=['#ef4444','#3b82f6','#22c55e','#eab308'],F=[523,659,784,988];
 const seq=Array.from({length:4},()=>Math.random()*4|0);let i=0,busy=true;
 box.innerHTML=`<p class="mgt" id="st">🎵 불빛 순서를 잘 기억하세요…</p><div class="simon">${cols.map((c,k)=>`<button class="sp" data-k="${k}" style="background:${c};color:${c}"></button>`).join('')}</div>`;
 const pads=[...box.querySelectorAll('.sp')],st=box.querySelector('#st');
 const lit=(k,ms)=>{pads[k].classList.add('lit');initAudio();beep(F[k],ms/1000,'sine',0,.12);setTimeout(()=>pads[k].classList.remove('lit'),ms)};
 const show=()=>{busy=true;i=0;st.textContent='🎵 불빛 순서를 잘 기억하세요…';seq.forEach((k,j)=>setTimeout(()=>box.isConnected&&lit(k,450),700+j*700));setTimeout(()=>{busy=false;st.textContent='👆 같은 순서로 눌러보세요!'},700+seq.length*700)};
 pads.forEach(b=>b.onclick=()=>{if(busy)return;const k=+b.dataset.k;lit(k,250);if(k===seq[i]){if(++i===seq.length){busy=true;st.textContent='🎉 성공!';setTimeout(done,500)}}else{busy=true;st.textContent='❌ 틀렸어요! 다시 보여줄게요';shake(box.querySelector('.simon'));setTimeout(show,900)}});
 show();
}
function mgQuiz(box,done,t){
 const q=t.q||{q:'1+1은?',a:'2',w:['3','11']};
 const opts=shuffle([q.a,...q.w]);
 box.innerHTML=`<p class="mgt">📚 ${esc(q.q)}</p>${opts.map(o=>`<button class="opt">${esc(o)}</button>`).join('')}`;
 box.querySelectorAll('.opt').forEach((b,k)=>b.onclick=()=>{if(opts[k]===q.a){b.style.background='#16a34a';setTimeout(done,400)}else{b.classList.add('bad');b.disabled=true;shake(b);toast('다시 생각해 봐요!','#dc2626')}});
}

/* ========= 시작 ========= */
(function boot(){
 if(Q.get('join')){const c=ST.getItem('ship-code'),n=ST.getItem('ship-name');if(c===Q.get('join')&&n)startPlayer(c,n);else joinForm('');return}
 const c=ST.getItem('ship-code'),n=ST.getItem('ship-name');
 if(c&&n&&!Q.has('host')){startPlayer(c,n);return}
 home();
})();
</script>
</body>
